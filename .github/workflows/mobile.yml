name: Mobile app

on:
  push:
    branches: ["**"]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
    tags: ["mobile-v*"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.5"
  # Optional repository variable to bake a different default server into the
  # build. Users can still change it in Settings at any time.
  DEFAULT_SERVER: ${{ vars.DEFAULT_SERVER || 'https://abolfazl.fun' }}

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android (APK + App Bundle)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # Release signing. Add these repository secrets to sign with your own
      # key; without them the build is signed with a throwaway debug key.
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Configure signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$STORE_PW"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PW"
            } > android/key.properties
            echo "Using release keystore"
          else
            echo "::warning::No signing secrets set; release build uses the debug key"
          fi

      - name: Build APK
        run: >
          flutter build apk --release --split-per-abi
          --build-number=${{ github.run_number }}
          --dart-define=DEFAULT_SERVER=${{ env.DEFAULT_SERVER }}
          --dart-define=APP_VERSION=1.0.0+${{ github.run_number }}
          --obfuscate --split-debug-info=build/symbols
      - name: Build universal APK
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=DEFAULT_SERVER=${{ env.DEFAULT_SERVER }}
          --dart-define=APP_VERSION=1.0.0+${{ github.run_number }}
          --obfuscate --split-debug-info=build/symbols
      - name: Build App Bundle
        run: >
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --dart-define=DEFAULT_SERVER=${{ env.DEFAULT_SERVER }}
          --dart-define=APP_VERSION=1.0.0+${{ github.run_number }}
          --obfuscate --split-debug-info=build/symbols
      - name: Remove signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
            mobile/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    name: iOS
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Builds without code signing so the pipeline works on any fork. The
      # resulting .ipa can be re-signed (e.g. with fastlane or Xcode) or
      # side-loaded; App Store upload needs an Apple developer certificate.
      - name: Build iOS app
        run: >
          flutter build ios --release --no-codesign
          --build-number=${{ github.run_number }}
          --dart-define=DEFAULT_SERVER=${{ env.DEFAULT_SERVER }}
          --dart-define=APP_VERSION=1.0.0+${{ github.run_number }}
          --obfuscate --split-debug-info=build/symbols
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qr GPSTracker-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: mobile/build/ipa/GPSTracker-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/android/**/*.apk
            dist/android/**/*.aab
            dist/ios/*.ipa
