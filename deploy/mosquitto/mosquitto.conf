# Mosquitto config for LOCAL DEVELOPMENT ONLY.
#
# allow_anonymous is true so the stack starts with no credential setup. The
# broker is published on 127.0.0.1 only (see docker-compose.yml), so nothing
# outside this machine can reach it.
#
# Production must NOT use this file: VPS/deploy.sh configures a password file
# and the device firmware authenticates with MQTT_USER / MQTT_PASSWORD.

listener 1883 0.0.0.0
protocol mqtt

# WebSocket listener, matching the production broker layout.
listener 8083 0.0.0.0
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# Log to stdout so `docker compose logs mosquitto` shows everything.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
