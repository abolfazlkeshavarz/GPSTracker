# Production Mosquitto config.
#
# Unlike the development config, anonymous access is refused: the broker is
# published to the internet so devices on the mobile network can reach it,
# and an open broker lets anyone inject location data for any device.
#
# Create the password file before starting the stack:
#     make mqtt-passwd MQTT_USER=tracker MQTT_PASSWORD=<strong-password>

listener 1883 0.0.0.0
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd

# The device secret in each payload is still checked by the backend, so a
# stolen broker credential alone cannot forge data for a device.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Devices publish every 30s; drop a client that has gone quiet for too long.
keepalive_interval 60
max_keepalive 120
