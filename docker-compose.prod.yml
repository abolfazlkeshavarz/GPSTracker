# Production stack: the whole application as containers.
#
#   cp .env.prod.example .env.prod   # then edit it
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Only nginx publishes a port. Postgres, Redis, the broker and the API are
# reachable only on the internal network, so the database is not exposed to
# the internet even if the host firewall is misconfigured.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-tracking_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Applied only when the data directory is empty, i.e. first boot.
      - ./tracking-backend/scripts/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-tracking_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # Devices connect from the mobile network, so this one must be public.
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/#' -C 1 -W 3 -u $${MQTT_USER} -P $${MQTT_PASSWORD} >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}

  backend:
    build:
      context: ./tracking-backend
      args:
        VERSION: ${VERSION:-prod}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-tracking_db}
      DB_SSLMODE: ${DB_SSLMODE:-disable}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      MQTT_BROKER: tcp://mosquitto:1883
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TOPIC: ${MQTT_TOPIC:-devices/+/location}

      # Refuses to start if unset or shorter than 32 characters, because
      # APP_ENV is production.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-72}

      SERVER_PORT: 8080
      APP_ENV: production
      APP_DOMAIN: ${APP_DOMAIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TZ: ${TZ:-Asia/Tehran}
    # No ports: reachable only through nginx.

  tileserver:
    image: maptiler/tileserver-gl:latest
    restart: unless-stopped
    command: ["--config", "/data/config.json", "--port", "8080", "--public_url", "${PUBLIC_URL:-http://localhost}/tiles/"]
    volumes:
      - ${MAPS_DIR:?MAPS_DIR is required}:/data:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./tracking-frontend
      args:
        # Same-origin: nginx proxies /tiles to the tileserver container.
        VITE_MAP_STYLE_URL: /tiles/styles/osm-bright/style.json
    restart: unless-stopped
    depends_on:
      - backend
      - tileserver
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  postgres-data:
  redis-data:
  mosquitto-data:
