<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Standard favicon (replacing your current one) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    
    <!-- iOS / iPadOS home screen -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    
    <!-- The manifest link is injected at build time by vite-plugin-pwa, which
         emits manifest.webmanifest. Do not add one by hand: with two manifest
         links the browser picks one arbitrarily, and the stale copy wins as
         often as not. -->

    <!-- iOS reads these rather than the manifest to decide standalone display. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ردگَرد" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2a78d6" />
    <title>رد گَرد| GPS Tracking & Fleet Management</title>

    <!--
      Resolve the theme before first paint. Without this the page renders in
      light, then flips to dark once React mounts - a visible white flash on
      every load for dark-mode users.
      Kept inline and dependency-free so it runs before the bundle arrives.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          /* Private mode can throw on localStorage; light is a fine default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
