# nginx config for the production frontend container.
#
# Serves the SPA and reverse-proxies /api to the backend, so the browser sees
# one origin and CORS never enters the picture.

# Sets Connection: upgrade only on a real WebSocket handshake, and
# Connection: close otherwise. Without this, proxying /api/ws fails.
# conf.d/*.conf is included in the http context, where `map` is valid.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend {
    # Docker's embedded DNS resolves this to the backend service.
    server backend:8080;
}

upstream tiles {
    server tileserver:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are small; a device payload is well under 1 KB.
    client_max_body_size 2m;

    # --- security headers -------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The bearer token lives in localStorage, so a single XSS is enough to
    # steal a session; the CSP is the main mitigation. 'unsafe-eval' is
    # required by maplibre-gl, which compiles style expressions at runtime.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/vnd.mapbox-vector-tile;
    gzip_min_length 1024;

    # --- API --------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The backend's rate limiter keys on the client IP, so this header
        # must be correct or every request appears to come from nginx.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /api/ws. Harmless on ordinary requests.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long timeouts so idle WebSocket connections are not culled; the
        # server sends a ping every 54s to keep them alive.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    location = /health {
        proxy_pass http://backend/health;
        access_log off;
    }

    # --- map tiles --------------------------------------------------------
    location /tiles/ {
        proxy_pass http://tiles/;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- static assets ----------------------------------------------------
    # Vite emits content-hashed filenames, so these can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients pin to a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # SPA fallback: client-side routes like /device/X/history are not files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
